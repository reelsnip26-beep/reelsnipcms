name = "adpush-cloudflare-cms"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "advertising-db"
database_id = "YOUR_D1_DATABASE_ID" # Run: npx wrangler d1 create advertising-db

# Cloudflare R2 Storage Bucket Binding
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "adpush-media-bucket"

# Environment Variables & Secrets (Configure via Cloudflare Pages Settings or .dev.vars)
[vars]
ENVIRONMENT = "production"
DEFAULT_TIMEZONE = "UTC"
ALLOW_ANONYMOUS_IMPRESSIONS = "true"
ADMIN_SESSION_SECRET = "super-secure-random-key-change-me"
ADMIN_PASSWORD_HASH = "CHANGE_IN_CLOUDFLARE_PAGES_VARIABLES" # Or bcrypt hash
R2_PUBLIC_DOMAIN = "https://media.yourdomain.com"
